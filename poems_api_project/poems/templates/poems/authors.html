{%load static%}
{%load i18n%}
<link rel="stylesheet" href="{% static 'poems/style.css'%}">
{% if authors_list %}
    <ul>
    {% for author in authors_list %}
        <li><a href={% url 'author' author_id=author.id %}>{{ author.name }}</a></li>
       
        {% endfor %}
    </ul>
{% else %}
    <p>{% translate "No authors are available." %}</p>
{% endif %}
